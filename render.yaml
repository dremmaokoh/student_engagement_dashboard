# Student Engagement Dashboard — API + React SPA on one web service (MongoDB Atlas).
services:
  - type: web
    name: student-engagement-dashboard
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: cd client && npm ci && npm run build && cd ../server && npm ci
    startCommand: cd server && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: AUTH_REGISTER_ENABLED
        value: "true"